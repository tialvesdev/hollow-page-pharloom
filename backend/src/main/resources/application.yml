server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: pharloom-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pharloom}
    username: ${DB_USUARIO:pharloom}
    password: ${DB_SENHA:pharloom}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

pharloom:
  jwt:
    # Em produção, JWT_SEGREDO precisa ter pelo menos 32 caracteres aleatórios.
    segredo: ${JWT_SEGREDO:segredo-de-desenvolvimento-troque-em-producao-0123456789}
    validade-dias: ${JWT_VALIDADE_DIAS:30}
  cookie:
    nome: pharloom_sessao
    seguro: ${COOKIE_SEGURO:false}
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
